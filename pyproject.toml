[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "support-signals-lakehouse"
version = "0.1.0"
description = "Incremental lakehouse for AWS customer-support signals: GitHub issues -> S3 -> Spark -> Redshift"
requires-python = ">=3.10"
dependencies = [
  "pyspark==3.5.3",
  "pyyaml>=6",
  "requests>=2.31",
  "duckdb>=1.1",
  "pandas>=2.0",
  "pyarrow>=14",
  "scikit-learn>=1.3",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
dashboard = ["streamlit>=1.38"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B023"]
